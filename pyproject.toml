[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dualflow3"
version = "0.1.0"
description = "Structured agent-to-agent delegation: decomposition error, negotiation and verification"
requires-python = ">=3.11"
dependencies = ["openai>=1.50.0"]

[project.optional-dependencies]
figures = ["matplotlib>=3.8"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
